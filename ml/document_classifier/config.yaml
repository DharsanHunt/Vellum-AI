model_name: "document_classifier"
version: "1.0.0"
architecture: "LightweightConvNet_EmbeddingHead"
input_shape: [3, 224, 224]
num_classes: 5
classes:
  - "ACADEMIC_CERTIFICATE"
  - "TRANSCRIPT"
  - "RECOMMENDATION_LETTER"
  - "ID_PASSPORT"
  - "INTERNSHIP_CERTIFICATE"
training:
  epochs: 8
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
checkpoint: "models/document_classifier.pt"
